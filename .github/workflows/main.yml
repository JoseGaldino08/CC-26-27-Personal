name: main

on:
  push:
    
    branches: 
      - main 
    tags:
      - "v*.*.*"
  pull_request:
    branches: [ main ]

jobs:

  build:
    name: Ubuntu Version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v2

      - name: Install dependencies
        run: |
          pip install ruff pytest
          pip install -r farm_service/requirements.txt
          pip install -r telemetry_service/requirements.txt

      - name: Install Python linter
        run: pip install ruff

      - name: Run Python linter
        run: ruff check farm_service telemetry_service

      - name: Check Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: farm_service/Dockerfile      

      - name: Check telemetry Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: telemetry_service/Dockerfile


  publish-images:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))


    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: farm_service
            image: farm
          - service: telemetry_service
            image: telemetry

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase repository owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tag
        id: tags
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/agrosense_${{ matrix.image }}:${{ steps.tags.outputs.tag }}
