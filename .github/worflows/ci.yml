name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.14"

      uses: docker/setup-buildx-action@v2
    
    run: |
      pip install ruff pytest
      pip install -r services/farm-service/requirements.txt
      pip install -r services/monitoring-service/requirements.txt

