name: main

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build:
    name: Ubuntu Version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v2

      - name: Install dependencies
        run: |
          pip install ruff pytest
          pip install -r farm_service/requirements.txt
          pip install -r telemetry_service/requirements.txt

      - name: Install Python linter
        run: pip install ruff

      - name: Run Python linter
        run: ruff check farm_service telemetry_service

      - name: Check Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: farm_service/Dockerfile      

      - name: Check telemetry Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: telemetry_service/Dockerfile
